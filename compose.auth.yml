# Optional overlay: mount allowed-email list as YAML (instead of long SAML_ALLOWED_EMAILS in .env).
# On the VM (example):
#   export SAML_ALLOWED_EMAILS_HOST_PATH=/etc/nano-chat/allowed_emails.yaml
#   docker compose -f compose.yml -f compose.auth.yml up -d
#
# You can combine with compose.saml.yml:
#   docker compose -f compose.yml -f compose.saml.yml -f compose.auth.yml up -d
#
# See config/allowed_emails.example.yaml for the file format.

services:
  server:
    volumes:
      - ${SAML_ALLOWED_EMAILS_HOST_PATH:?Set SAML_ALLOWED_EMAILS_HOST_PATH to the YAML on the host}/run/config/allowed_emails.yaml:ro
    environment:
      SAML_ALLOWED_EMAILS_PATH: /run/config/allowed_emails.yaml
