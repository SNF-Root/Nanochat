# Sole allow-list for SAML users. Bind-mount into the container (see compose.yml /
# SAML_ALLOWED_EMAILS_HOST_PATH → /run/config/allowed_emails.yaml).

allowed_emails:
  - alice@stanford.edu
  - bob@example.com

# Also accepted: a plain YAML list at the root:
#   - one@example.com
#   - two@example.com
#
# Or key "emails:" with the same list shape.
