services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pgvector-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    networks:
      - prom-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: prom-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - prom-network
    restart: unless-stopped

  # SAML IdP PEM + allow-list YAML: set host paths in .env (required for compose config):
  #   SAML_IDP_CERT_HOST_PATH, SAML_ALLOWED_EMAILS_HOST_PATH
  server:
    build:
      context: .
      dockerfile: Dockerfile   
    container_name: prom-server
    command: ["bash", "-lc", "sleep infinity"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://redis:6379/0
      STANFORD_API_KEY: ${STANFORD_API_KEY}
      STANFORD_BASE_URL: https://aiapi-prod.stanford.edu/v1
      SAML_IDP_X509_CERT_PATH: /run/saml/idp.pem
      SAML_ALLOWED_EMAILS_PATH: /run/config/allowed_emails.yaml
    ports:
      - "3000:3000"  # frontend on 3000
      - "8000:8000"  # backend on 8000
    volumes:
      - .:/app
      - ${SAML_IDP_CERT_HOST_PATH:?Set SAML_IDP_CERT_HOST_PATH in .env to the IdP PEM on the host}/run/saml/idp.pem:ro
      - ${SAML_ALLOWED_EMAILS_HOST_PATH:?Set SAML_ALLOWED_EMAILS_HOST_PATH in .env to the allow-list YAML on the host}/run/config/allowed_emails.yaml:ro
    networks:
      - prom-network
    restart: unless-stopped
    env_file:
      - .env

volumes:
  pgvector_data:
  redis_data:

networks:
  prom-network:
    name: prom-network
